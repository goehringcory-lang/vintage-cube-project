name: GitHub Pages

# GitHub Pages cannot send the COOP/COEP headers SharedArrayBuffer needs, so
# the build adds coi-serviceworker, which re-serves every response with them.
# The first visit reloads once while that worker installs.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  GRAALVM_EA_TAG: jdk-25i3-25.0.4.1-ea.03
  BINARYEN_VERSION: "123"
  COI_SERVICEWORKER_VERSION: "0.1.7"

jobs:
  build:
    if: github.repository != 'witchesofthehill/manabrew'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.13.1

      - name: Cache the Web Image toolchain
        id: webimage-toolchain
        uses: actions/cache@v4
        with:
          path: ~/.local/webimage
          key: webimage-${{ env.GRAALVM_EA_TAG }}-binaryen-${{ env.BINARYEN_VERSION }}

      - name: Install the Web Image toolchain
        if: steps.webimage-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/webimage" && cd "$HOME/.local/webimage"
          curl -fsSL -o graalvm.tar.gz \
            "https://github.com/graalvm/oracle-graalvm-ea-builds/releases/download/${GRAALVM_EA_TAG}/graalvm-jdk-${GRAALVM_EA_TAG#jdk-}_linux-x64_bin.tar.gz"
          tar xzf graalvm.tar.gz && rm graalvm.tar.gz
          curl -fsSL -o binaryen.tar.gz \
            "https://github.com/WebAssembly/binaryen/releases/download/version_${BINARYEN_VERSION}/binaryen-version_${BINARYEN_VERSION}-x86_64-linux.tar.gz"
          tar xzf binaryen.tar.gz && rm binaryen.tar.gz

      - name: Install JS dependencies
        run: |
          corepack enable
          yarn install --frozen-lockfile

      - name: Build the wasm Forge engine
        run: |
          set -euo pipefail
          export PATH="$HOME/.local/webimage/binaryen-version_${BINARYEN_VERSION}/bin:$PATH"
          export WEBIMAGE_GRAALVM_HOME="$(echo "$HOME"/.local/webimage/graalvm-*)"
          scripts/build-forge-wasm.sh
          ls -la packages/forge-wasm/forgeharness*

      - name: Build the web app
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_SCRYFALL_SYMBOL_BASE: https://svgs.scryfall.io/card-symbols/
        run: yarn build:web

      - name: Add cross-origin isolation and SPA fallback
        run: |
          set -euo pipefail
          mkdir -p target/coi
          npm pack --pack-destination target/coi "coi-serviceworker@${COI_SERVICEWORKER_VERSION}"
          tar xzf target/coi/coi-serviceworker-*.tgz -C target/coi
          cp target/coi/package/coi-serviceworker.min.js dist/coi-serviceworker.js
          cp target/coi/package/LICENSE dist/coi-serviceworker.LICENSE
          base="/${{ github.event.repository.name }}/"
          sed -i "s|<head>|<head><script>window.coi={coepCredentialless:()=>false}</script><script src=\"${base}coi-serviceworker.js\"></script>|" dist/index.html
          grep -q coi-serviceworker.js dist/index.html
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
